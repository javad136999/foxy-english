<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#dff3ff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<title>فاکسی؛ انگلیسی با بازی</title>
<style>
:root{--ink:#3b3568;--card:#fff;--edge:rgba(59,53,104,.14);--glow:rgba(59,53,104,.14);--sky:#dff3ff;--hill1:#b8ecc4;--hill2:#8fdcae;--ok:#3ecf8e;--bad:#ff6f7d;--pri:#ff7a8a;--acc:#ffd34e;--vio:#8b7bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
body[data-age=a]{--sky:#fff1c4;--acc:#ffc93c}body[data-age=b]{--sky:#d6f6ee;--acc:#3fd0b8}body[data-age=c]{--sky:#e6e0ff;--acc:#8b7bff}
@media (prefers-color-scheme:dark){:root,body[data-age]{--ink:#fff;--card:#3a3470;--edge:rgba(0,0,0,.35);--glow:rgba(0,0,0,.3);--sky:#2a2459;--hill1:#2f3d6b;--hill2:#26335c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(var(--sky),var(--card) 140%) fixed;color:var(--ink);font-family:Vazirmatn,Estedad,ui-rounded,Tahoma,system-ui,sans-serif;display:flex;justify-content:center;transition:background .4s}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg::before{content:"";position:absolute;bottom:-90px;left:-20%;width:90%;height:230px;border-radius:50%;background:var(--hill1)}
#bg::after{content:"";position:absolute;bottom:-120px;right:-25%;width:100%;height:240px;border-radius:50%;background:var(--hill2)}
#bg i{position:absolute;top:70px;width:90px;height:26px;border-radius:99px;background:#fff;opacity:.75;box-shadow:28px -14px 0 8px #fff,-24px -6px 0 0 #fff;animation:drift 38s linear infinite}
#bg i:nth-child(2){top:190px;transform:scale(.7);animation-duration:55s;animation-delay:-20s}
@media (prefers-color-scheme:dark){#bg i{opacity:.12}}
@keyframes drift{from{right:-140px}to{right:110%}}
#app{position:relative;z-index:1;width:100%;max-width:520px;padding:14px 16px 48px;text-align:center}
h1{font-size:28px;font-weight:900;margin:4px 0 2px}h2{margin:6px 0;font-weight:800}p{margin:6px 0 14px;opacity:.75}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border-radius:99px;padding:7px 16px;font-weight:800;box-shadow:0 3px 0 var(--edge),0 8px 16px var(--glow)}
.sticker{display:block;width:100%;background:var(--card);border-radius:30px;box-shadow:0 7px 0 var(--edge),0 14px 24px var(--glow);padding:16px;margin:14px 0;font-size:20px;font-weight:800;transition:transform .12s,box-shadow .12s}
.sticker:active,.opt:active,.tile:active,.card:active{transform:translateY(5px);box-shadow:0 2px 0 var(--edge)}
.sticker small{display:block;font-weight:500;font-size:14px;opacity:.65;margin-top:3px}
.age{display:flex;align-items:center;gap:16px;text-align:right;background:var(--c)}.age span:last-child{flex:1;color:#3b3568}
.ab{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:40px}
.fox{font-size:92px;line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 8px var(--glow))}
@keyframes bob{50%{transform:translateY(-9px) rotate(-5deg)}}
.g2,.g3{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.cat{margin:0;position:relative;padding:18px 8px;color:#3b3568}
.cat b{display:flex;align-items:center;justify-content:center;width:78px;height:78px;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,.7);font-size:44px;font-weight:400}
.cat i{position:absolute;top:10px;left:12px;font-style:normal;font-size:18px}
.opt{background:var(--card);border-radius:26px;box-shadow:0 6px 0 var(--edge),0 12px 20px var(--glow);padding:16px 6px;font-size:22px;font-weight:800;direction:ltr}
.opt.fa{direction:rtl}.opt.emo{font-size:60px;padding:10px;font-weight:400}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff;animation:shk .35s}
@keyframes shk{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.big{font-size:108px;line-height:1.1;margin:4px 0;filter:drop-shadow(0 10px 8px var(--glow))}.en{font-size:46px;font-weight:900;direction:ltr;margin:10px 0}
.say{background:var(--vio);color:#fff;border-radius:99px;padding:10px 24px;font-size:18px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.18);margin:6px 0 16px}
.bar{height:16px;border-radius:9px;background:var(--edge);overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .35s}
.slots,.tiles{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;direction:ltr;margin:14px 0}
.slot{width:44px;height:52px;border-bottom:5px solid var(--acc);font-size:30px;font-weight:900}
.tile{width:52px;height:58px;border-radius:16px;background:var(--acc);color:#3b3568;font-size:28px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.16)}.tile:disabled{opacity:.18}
.card{height:98px;background:linear-gradient(145deg,#a89bff,#7b6cff);color:#fff;border-radius:22px;font-size:26px;font-weight:800;direction:ltr;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.card.up{background:var(--card);color:var(--ink)}.card.ok{background:var(--ok);color:#fff}
.stars{font-size:58px;margin:10px 0;letter-spacing:4px}
#ov{position:fixed;inset:0;background:rgba(40,30,90,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov>div{background:var(--sky);border-radius:34px;padding:22px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.row{display:flex;gap:10px;justify-content:center;margin:14px 0}.row .opt{flex:1}
.cf{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall 1.7s linear forwards;z-index:12}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.fox,.cf,#bg i{animation:none}}
button:focus-visible{outline:4px solid var(--vio);outline-offset:3px}
</style>
</head>
<body><div id="bg"><i></i><i></i></div><div id="app"></div>
<script>
// ===== تنظیمات (بعد از ساخت پروژه Supabase پر کنید) =====
const SB_URL='',SB_KEY='';
// ===== محتوا =====
const T=s=>s.split(',').map(x=>{const p=x.trim().split(' ');return{e:p[0],w:p[1],f:p.slice(2).join(' ')}});
const CL=[
{id:'animals',n:'حیوانات',e:'🐶',c:'#ffc2a8',w:T('🐶 dog سگ,🐱 cat گربه,🐟 fish ماهی,🐦 bird پرنده,🐮 cow گاو,🐴 horse اسب,🐘 elephant فیل,🦁 lion شیر,🐵 monkey میمون,🐰 rabbit خرگوش')},
{id:'fruits',n:'میوه‌ها',e:'🍎',c:'#ffb3c1',w:T('🍎 apple سیب,🍌 banana موز,🍇 grapes انگور,🍊 orange پرتقال,🍉 watermelon هندوانه,🍓 strawberry توت‌فرنگی,🍐 pear گلابی,🍒 cherry گیلاس')},
{id:'colors',n:'رنگ‌ها',e:'🌈',c:'#c9b8ff',w:T('🔴 red قرمز,🔵 blue آبی,🟢 green سبز,🟡 yellow زرد,🟠 orange نارنجی,🟣 purple بنفش,⚫ black سیاه,⚪ white سفید')},
{id:'numbers',n:'اعداد',e:'🔢',c:'#b8e8ff',w:T('1️⃣ one یک,2️⃣ two دو,3️⃣ three سه,4️⃣ four چهار,5️⃣ five پنج,6️⃣ six شش,7️⃣ seven هفت,8️⃣ eight هشت,9️⃣ nine نه,🔟 ten ده')},
{id:'body',n:'بدن',e:'🖐️',c:'#ffe0a3',w:T('👁️ eye چشم,👂 ear گوش,👃 nose بینی,👄 mouth دهان,✋ hand دست,🦶 foot پا,🦷 tooth دندان,🧠 brain مغز')},
{id:'food',n:'غذا',e:'🍕',c:'#ffd0a1',w:T('🍞 bread نان,🧀 cheese پنیر,🥚 egg تخم‌مرغ,🥛 milk شیر,🍕 pizza پیتزا,🍔 burger همبرگر,🍚 rice برنج,🍰 cake کیک')},
{id:'vehicles',n:'وسایل نقلیه',e:'🚗',c:'#b9f0c9',w:T('🚗 car ماشین,🚌 bus اتوبوس,🚲 bicycle دوچرخه,✈️ plane هواپیما,🚂 train قطار,🚢 ship کشتی,🚁 helicopter هلیکوپتر,🚀 rocket موشک')},
{id:'nature',n:'طبیعت',e:'🌳',c:'#c8f2a6',w:T('🌞 sun خورشید,🌙 moon ماه,⭐ star ستاره,🌳 tree درخت,🌸 flower گل,🌧️ rain باران,❄️ snow برف,🌈 rainbow رنگین‌کمان')},
{id:'school',n:'مدرسه',e:'🎒',c:'#ffe58f',w:T('📚 book کتاب,✏️ pencil مداد,🎒 bag کیف,🏫 school مدرسه,👩‍🏫 teacher معلم,📏 ruler خط‌کش,✂️ scissors قیچی,🖊️ pen خودکار')},
{id:'home',n:'خانه',e:'🏠',c:'#d6c4ff',w:T('🏠 house خانه,🛏️ bed تخت,🪑 chair صندلی,🚪 door در,🪟 window پنجره,📺 television تلویزیون,🔑 key کلید,💡 lamp لامپ')},
{id:'jobs',n:'شغل‌ها',e:'👩‍⚕️',c:'#ffc4e1',w:T('👨‍⚕️ doctor دکتر,👨‍🍳 cook آشپز,👮 police پلیس,👨‍🚒 firefighter آتش‌نشان,👨‍🌾 farmer کشاورز,🧑‍🚀 astronaut فضانورد')}];
CL.push(
{id:'family',n:'خانواده',e:'👨‍👩‍👧',c:'#ffcad4',w:T('👨 father پدر,👩 mother مادر,👦 boy پسر,👧 girl دختر,👶 baby نوزاد,👴 grandfather پدربزرگ,👵 grandmother مادربزرگ,🧑‍🤝‍🧑 friend دوست')},
{id:'clothes',n:'لباس‌ها',e:'👕',c:'#bde0fe',w:T('👕 shirt پیراهن,👖 pants شلوار,🧦 socks جوراب,👟 shoes کفش,🧢 hat کلاه,🧥 coat کت,🧤 gloves دستکش,👗 dress لباس')},
{id:'toys',n:'اسباب‌بازی',e:'🧩',c:'#ffd6a5',w:T('⚽ ball توپ,🎈 balloon بادکنک,🧩 puzzle پازل,🎁 gift هدیه,🎲 dice تاس,🥁 drum طبل')},
{id:'shapes',n:'شکل‌ها',e:'🔷',c:'#a0c4ff',w:T('🔺 triangle مثلث,🟦 square مربع,⭕ circle دایره,⭐ star ستاره,❤️ heart قلب,🔷 diamond لوزی')},
{id:'sea',n:'دریا',e:'🐳',c:'#9bf6ff',w:T('🐳 whale نهنگ,🐙 octopus هشت‌پا,🦀 crab خرچنگ,🐢 turtle لاک‌پشت,🐬 dolphin دلفین,🦈 shark کوسه,🐚 shell صدف,🦐 shrimp میگو')},
{id:'insects',n:'حشرات',e:'🦋',c:'#caffbf',w:T('🐝 bee زنبور,🦋 butterfly پروانه,🐞 ladybug کفشدوزک,🐜 ant مورچه,🕷️ spider عنکبوت,🐛 worm کرم,🦗 cricket جیرجیرک,🐌 snail حلزون')},
{id:'veggies',n:'سبزیجات',e:'🥕',c:'#fdffb6',w:T('🥕 carrot هویج,🍅 tomato گوجه,🥔 potato سیب‌زمینی,🌽 corn ذرت,🥒 cucumber خیار,🧅 onion پیاز,🧄 garlic سیر,🍆 eggplant بادمجان')},
{id:'sports',n:'ورزش',e:'🏀',c:'#ffadad',w:T('⚽ football فوتبال,🏀 basketball بسکتبال,🏊 swimming شنا,🚴 cycling دوچرخه‌سواری,🥋 karate کاراته,🎾 tennis تنیس,🏐 volleyball والیبال,♟️ chess شطرنج')},
{id:'feelings',n:'احساسات',e:'😀',c:'#ffe66d',w:T('😀 happy شاد,😢 sad ناراحت,😡 angry عصبانی,😴 sleepy خواب‌آلود,😮 surprised متعجب,😱 scared ترسیده,😎 cool باحال,😍 love عاشق')},
{id:'kitchen',n:'آشپزخانه',e:'🍳',c:'#ffd9b3',w:T('🍴 fork چنگال,🥄 spoon قاشق,🔪 knife چاقو,🍽️ plate بشقاب,🥣 bowl کاسه,🥤 cup لیوان,🍳 pan ماهیتابه,🍵 tea چای')},
{id:'places',n:'مکان‌ها',e:'🏞️',c:'#b5ead7',w:T('🏥 hospital بیمارستان,🏪 shop مغازه,🕌 mosque مسجد,🏖️ beach ساحل,⛰️ mountain کوه,🌉 bridge پل,🏞️ park پارک,🏦 bank بانک')},
{id:'tech',n:'وسایل برقی',e:'💻',c:'#c7ceea',w:T('📱 phone تلفن‌همراه,💻 laptop لپ‌تاپ,📷 camera دوربین,⏰ clock ساعت,🎧 headphones هدفون,🖥️ computer رایانه,⌚ watch ساعت‌مچی,🔋 battery باتری')});
const CM={};CL.forEach(c=>CM[c.id]=c);
const AG={a:{t:'۴ تا ۵ سال',e:'🐣',c:['animals','fruits','colors','numbers','family','clothes','toys','shapes','sea','veggies'],g:['listen','match']},
b:{t:'۶ تا ۷ سال',e:'🚀',c:['animals','fruits','numbers','body','food','vehicles','nature','family','clothes','toys','shapes','sea','insects','veggies','sports','feelings','kitchen'],g:['pick','listen','match']},
c:{t:'۸ تا ۱۰ سال',e:'🏆',c:['body','food','vehicles','school','nature','home','jobs','family','sea','insects','veggies','sports','places','tech','feelings','kitchen'],g:['spell','trans','pick']}};
const GN={listen:['🔊','بشنو و تصویر را بزن'],pick:['👀','کلمه را پیدا کن'],spell:['🔤','املای کلمه'],trans:['🇮🇷','معنی فارسی'],match:['🃏','بازی حافظه']};
const FREE=2,OK=['آفرین!','عالی بود!','دمت گرم!','خفن!','درسته!'];
// ===== وضعیت =====
let P={id:Math.random().toString(36).slice(2),age:null,stars:0,streak:0,last:'',premium:false,best:{},rounds:0},R={},GCB;
try{Object.assign(P,JSON.parse(localStorage.getItem('kea1')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('kea1',JSON.stringify(P))}catch(e){}sync()}
function sync(){if(!SB_URL)return;fetch(SB_URL+'/rest/v1/progress?on_conflict=device_id',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({device_id:P.id,data:P,updated_at:new Date().toISOString()})}).catch(()=>{})}
(function(){const d=new Date().toDateString();if(P.last!==d){P.streak=P.last===new Date(Date.now()-864e5).toDateString()?P.streak+1:1;P.last=d;save()}})();
// ===== ابزار =====
const app=document.getElementById('app');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
let AC;function beep(f,d=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function confetti(){for(let i=0;i<22;i++){const s=document.createElement('span');s.className='cf';s.textContent=['⭐','🎉','✨','🎈','💛'][i%5];s.style.left=Math.random()*95+'%';s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}}
const topbar=(f,l)=>`<div class="top"><button class="pill" onclick="${f}">${l}</button><span class="pill">🔥 ${P.streak}</span><span class="pill">⭐ ${P.stars}</span></div>`;
function ov(h){cov();const d=document.createElement('div');d.id='ov';d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
function cov(){const o=document.getElementById('ov');if(o)o.remove()}
// ===== والدین، پرداخت، تبلیغ =====
function gate(cb){const a=2+Math.floor(Math.random()*7),b=2+Math.floor(Math.random()*7),r=a*b;GCB=cb;
ov(`<h2>🔒 فقط برای والدین</h2><p>برای ادامه جواب را بزنید:</p><h1>${a} × ${b} = ؟</h1><div class="row">${sh([r,r+4,r-3]).map(x=>`<button class="opt" onclick="gk(${x===r})">${x}</button>`).join('')}</div><button class="pill" onclick="cov()">انصراف</button>`)}
function gk(ok){cov();if(ok)GCB();else beep(180)}
function paywall(){ov(`<div class="fox">🦊</div><h2>نسخه کامل فاکسی</h2><p>همه دسته‌ها و بدون تبلیغ</p><button class="sticker" onclick="buy()">فعال‌سازی نسخه کامل</button><button class="pill" onclick="cov()">بعداً</button>`)}
function buy(){ /* TODO: اتصال به پرداخت درون‌برنامه‌ای کافه‌بازار/مایکت */ P.premium=true;save();cov();cats()}
function showAd(){let n=3;ov(`<p>تبلیغ</p><div class="big">📣</div><p>اینجا SDK تبلیغ کودک‌محور قرار می‌گیرد</p><button class="pill" id="sk" disabled>${n}</button>`);const b=document.getElementById('sk'),t=setInterval(()=>{n--;if(n<=0){clearInterval(t);b.disabled=false;b.textContent='بستن ✖';b.onclick=cov}else b.textContent=n},1000)}
// ===== صفحه‌ها =====
function ages(){document.body.dataset.age='';const D={a:['#ffe08a','شنیدن و انتخاب تصویر'],b:['#a8ecd9','دیدن و پیدا کردن کلمه'],c:['#cfc6ff','املا و معنی کلمه']};
app.innerHTML=`<div class="fox">🦊</div><h1>سلام! من فاکسی‌ام</h1><p>سن کودک را انتخاب کنید</p>`+Object.keys(AG).map(k=>`<button class="sticker age" style="--c:${D[k][0]}" onclick="setAge('${k}')"><span class="ab">${AG[k].e}</span><span>${AG[k].t}<small>${D[k][1]}</small></span></button>`).join('')+`<p><a href="/privacy.html" onclick="event.preventDefault();gate(()=>location.href='/privacy.html')" style="color:inherit">حریم خصوصی (ویژه والدین)</a></p>`}
function setAge(k){P.age=k;save();cats()}
function cats(){if(!P.age)return ages();document.body.dataset.age=P.age;const A=AG[P.age];
app.innerHTML=topbar('ages()','🔁 سن')+`<h1>${A.e} ${A.t}</h1><p>یک دسته انتخاب کن</p><div class="g2">`+A.c.map((id,i)=>{const c=CM[id],lk=!P.premium&&i>=FREE;return `<button class="sticker cat" style="background:${c.c};color:#2a2347" onclick="${lk?'gate(paywall)':`games('${id}')`}"><b>${c.e}</b>${c.n}${lk?'<i>🔒</i>':''}</button>`}).join('')+'</div>'}
function games(id){const c=CM[id];app.innerHTML=topbar('cats()','→ دسته‌ها')+`<div class="big">${c.e}</div><h1>${c.n}</h1>`+AG[P.age].g.map(g=>{const b=P.best[id+g]||0;return `<button class="sticker" onclick="start('${id}','${g}')">${GN[g][0]} ${GN[g][1]}<small>${'⭐'.repeat(b)||'هنوز بازی نشده'}</small></button>`}).join('')}
function start(cat,mode){R={cat,mode,i:0,s:0,f:0};if(mode==='match')return match();R.q=sh(CM[cat].w).slice(0,8);ask()}
const opts=(it,n)=>sh([...sh(CM[R.cat].w.filter(x=>x!==it)).slice(0,n-1),it]);
function head(){return topbar(`games('${R.cat}')`,'→ بازی‌ها')+`<div class="bar"><i style="width:${R.i/R.q.length*100}%"></i></div>`}
function ask(){if(R.i>=R.q.length)return fin(R.s/R.q.length>=.9?3:R.s/R.q.length>=.6?2:1);
const it=R.q[R.i],m=R.mode;R.f=0;let o,h=head();
if(m==='listen'){o=opts(it,3);app.innerHTML=h+`<p>گوش بده و تصویر درست را بزن</p><button class="say" id="sp">🔊 دوباره</button><div class="g3">${o.map((x,i)=>`<button class="opt emo" data-i="${i}">${x.e}</button>`).join('')}</div>`;setTimeout(()=>say(it.w),250)}
else if(m==='pick'){o=opts(it,4);app.innerHTML=h+`<div class="big">${it.e}</div><button class="say" id="sp">🔊 تلفظ</button><div class="g2">${o.map((x,i)=>`<button class="opt" data-i="${i}">${x.w}</button>`).join('')}</div>`}
else if(m==='trans'){o=opts(it,4);app.innerHTML=h+`<div class="en">${it.w}</div><button class="say" id="sp">🔊 تلفظ</button><div class="g2">${o.map((x,i)=>`<button class="opt fa" data-i="${i}">${x.f}</button>`).join('')}</div>`;setTimeout(()=>say(it.w),250)}
else{const w=it.w.toUpperCase().split(''),got=[];app.innerHTML=h+`<div class="big" style="font-size:84px">${it.e}</div><h2>${it.f}</h2><div class="slots" id="sl"></div><div class="tiles" id="tl"></div><button class="say" id="sp">🔊 تلفظ</button>`;
const sl=document.getElementById('sl'),tl=document.getElementById('tl'),dr=()=>sl.innerHTML=w.map((_,i)=>`<div class="slot">${got[i]||''}</div>`).join('');dr();
sh(w).forEach(ch=>{const b=document.createElement('button');b.className='tile';b.textContent=ch;b.onclick=()=>{if(w[got.length]===ch){got.push(ch);b.disabled=true;beep(660,.08);dr();if(got.length===w.length){if(!R.f)R.s++;win(it)}}else{R.f=1;beep(180);b.style.background='var(--bad)';setTimeout(()=>b.style.background='',350)}};tl.appendChild(b)});
document.getElementById('sp').onclick=()=>say(it.w);return}
document.getElementById('sp').onclick=()=>say(it.w);
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(o[b.dataset.i]===it){b.classList.add('ok');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);if(!R.f)R.s++;win(it)}else{R.f=1;b.classList.add('bad');beep(180);setTimeout(()=>b.classList.remove('bad'),400)}})}
function win(it){beep(880);say(it.w);R.i++;setTimeout(ask,950)}
function match(){const its=sh(CM[R.cat].w).slice(0,6);let open=[],mv=0,dn=0,lk=false;
app.innerHTML=topbar(`games('${R.cat}')`,'→ بازی‌ها')+`<p>هر تصویر را با کلمه‌اش جفت کن</p><div class="g3" id="mg"></div>`;const g=document.getElementById('mg');
sh(its.flatMap((x,i)=>[{i,e:1},{i,e:0}])).forEach(c=>{const b=document.createElement('button');b.className='card';b.textContent='❓';
b.onclick=()=>{if(lk||b.classList.contains('up'))return;b.classList.add('up');b.textContent=c.e?its[c.i].e:its[c.i].w;if(c.e)b.style.fontSize='44px';else say(its[c.i].w);open.push([c,b]);
if(open.length===2){mv++;lk=true;const[[x,bx],[y,by]]=open;open=[];
if(x.i===y.i){beep(880);dn++;bx.classList.add('ok');by.classList.add('ok');lk=false;if(dn===6)setTimeout(()=>fin(mv<=8?3:mv<=12?2:1),700)}
else setTimeout(()=>{[bx,by].forEach(z=>{z.classList.remove('up');z.textContent='❓';z.style.fontSize=''});lk=false},850)}};g.appendChild(b)})}
function fin(st){const k=R.cat+R.mode;P.best[k]=Math.max(P.best[k]||0,st);P.stars+=st;P.rounds++;save();confetti();beep(1000,.3);
app.innerHTML=topbar(`games('${R.cat}')`,'→ بازی‌ها')+`<div class="fox">🦊</div><h1>${OK[Math.floor(Math.random()*OK.length)]}</h1><div class="stars">${'⭐'.repeat(st)}</div><button class="sticker" onclick="start('${R.cat}','${R.mode}')">🔁 دوباره</button><button class="sticker" onclick="cats()">🏠 دسته‌ها</button>`;
if(!P.premium&&P.rounds%3===0)setTimeout(showAd,1200)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
cats();
</script>
</body></html>
